title: PowerShell Process With Encoded Command Argument
id: aa1fe0be-d2c4-488d-90f6-b080e43fe369
status: experimental
description: Detects a PowerShell or pwsh process using selected encoded-command argument spellings. Encoded commands also occur in legitimate automation.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Samuel Yoder
date: 2026-10-05
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    EventID: 1
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_argument:
    CommandLine|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco '
      - ' -encodedcommand '
  condition: selection_image and selection_argument
falsepositives:
  - Administrative scripts, deployment tools, and management agents using encoded commands
level: medium
