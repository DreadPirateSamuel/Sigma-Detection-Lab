name: Local Winlogbeat ECS compatibility
priority: 30
transformations:
  - id: local_sysmon_scope
    type: add_condition
    conditions:
      winlog.channel: Microsoft-Windows-Sysmon/Operational
    rule_cond_op: or
    rule_conditions:
      - type: logsource
        product: windows
        category: process_creation
      - type: logsource
        product: windows
        category: process_access
      - type: logsource
        product: windows
        category: registry_set
      - type: logsource
        product: windows
        category: wmi_event
  - id: local_executable_fields
    type: field_name_mapping
    mapping:
      process.executable.caseless: process.executable
      process.parent.executable.caseless: process.parent.executable
      process.parent.name.caseless: process.parent.name
  - id: local_registry_details
    type: field_name_mapping
    mapping:
      winlog.event_data.Details: registry.data.strings
    rule_conditions:
      - type: logsource
        product: windows
        category: registry_set
